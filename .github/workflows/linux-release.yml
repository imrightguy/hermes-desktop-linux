name: Linux desktop release

# Builds unofficial Linux desktop packages for each stable NousResearch/hermes-agent
# release and publishes them on this repository. This repo does not contain
# upstream source. The job checks out the upstream tag, applies patches/*.patch
# with `git apply --3way`, copies packaging/ into that tree, and builds.
#
# Schedule runs only after this file is on the default branch. The cron is
# 09:17 UTC every day. workflow_dispatch can be run from any branch that
# contains this file.
#
# Uses the default GITHUB_TOKEN only. It creates the Release and the failure
# issue in this repository. No personal access token is required.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream stable tag to publish (for example v0.22.5). Empty uses the latest stable release."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build packages but do not create a GitHub Release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: linux-desktop-release
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve upstream tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          # GitHub runs this script with errexit. Turn it off so a refused tag
          # still publishes the step outputs before the next step fails the job.
          set +e
          set -uo pipefail
          action=error
          tag=""
          version=""
          sha=""
          reason=""
          if [ -n "$REQUESTED" ]; then
            endpoint="repos/NousResearch/hermes-agent/releases/tags/${REQUESTED}"
          else
            endpoint="repos/NousResearch/hermes-agent/releases/latest"
          fi
          if ! gh api "$endpoint" > /tmp/upstream-release.json 2>/tmp/upstream-release.err; then
            reason="$(tr '\n' ' ' < /tmp/upstream-release.err)"
            reason="Could not read ${endpoint}. ${reason}"
          else
            # shellcheck disable=SC1091
            source <(python3 scripts/release_metadata.py decide --release-json /tmp/upstream-release.json --requested "$REQUESTED")
            if [ "$action" = "publish" ]; then
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                action=skip
                reason="Release ${tag} already exists in ${GITHUB_REPOSITORY}."
              else
                if ! sha="$(gh api "repos/NousResearch/hermes-agent/commits/${tag}" --jq .sha 2>/tmp/upstream-sha.err)"; then
                  action=error
                  reason="Could not resolve the commit for ${tag}. $(tr '\n' ' ' < /tmp/upstream-sha.err)"
                  sha=""
                fi
              fi
            fi
          fi
          {
            echo "action=${action}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "sha=${sha}"
            echo "reason<<REASON_END"
            echo "$reason"
            echo "REASON_END"
          } >> "$GITHUB_OUTPUT"
          echo "action=${action} tag=${tag} version=${version} sha=${sha}"
          echo "$reason"

      - name: Stop when the upstream release cannot be published
        if: steps.resolve.outputs.action == 'error'
        run: |
          echo "::error::${{ steps.resolve.outputs.reason }}"
          exit 1

      - name: Skip an existing release
        if: steps.resolve.outputs.action == 'skip'
        run: echo "${{ steps.resolve.outputs.reason }}"

  build-packages:
    name: Build AppImage deb rpm
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout upstream tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://github.com/NousResearch/hermes-agent.git upstream

      - name: Apply patches with git apply --3way
        run: |
          set -euo pipefail
          scripts/apply-packaging.sh upstream

      - name: Install Linux packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          pkgs=(build-essential fakeroot rpm)
          for candidate in libfuse2 libfuse2t64 libgtk-3-0 libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libatspi2.0-0t64 libdrm2 libgbm1 libasound2t64 libasound2; do
            ver="$(apt-cache policy "$candidate" | awk '/Candidate:/ {print $2}')"
            if [ -n "$ver" ] && [ "$ver" != "(none)" ]; then
              pkgs+=("$candidate")
            fi
          done
          sudo apt-get install -y -qq "${pkgs[@]}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: upstream
        run: npm ci

      - name: Stamp package metadata
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/release_metadata.py stamp --desktop upstream/apps/desktop --tag "$TAG" --date "$(date -u +%F)"

      - name: Build AppImage deb and rpm
        working-directory: upstream/apps/desktop
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          # Actions would stamp this packaging repo's SHA and branch. The
          # desktop installer pins GITHUB_SHA and checks that commit is on
          # GITHUB_REF_NAME in NousResearch/hermes-agent, so both have to be
          # the upstream release.
          GITHUB_SHA: ${{ needs.plan.outputs.sha }}
          GITHUB_REF_NAME: main
          GITHUB_REPOSITORY: NousResearch/hermes-agent
        run: npm run dist:linux -- --x64 "-c.extraMetadata.version=${VERSION}"

      - name: Verify native packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd upstream/apps/desktop/release
          ls -lh
          test -f "Hermes-${VERSION}-linux-x86_64.AppImage"
          test -f "Hermes-${VERSION}-linux-amd64.deb"
          test -f "Hermes-${VERSION}-linux-x86_64.rpm"
          test -d linux-unpacked
          test -e linux-unpacked/Hermes
          chmod +x "Hermes-${VERSION}-linux-x86_64.AppImage"
          dpkg-deb -I "Hermes-${VERSION}-linux-amd64.deb" | head -n 20
          rpm -qp "Hermes-${VERSION}-linux-x86_64.rpm"

      - name: Upload native packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-appimage-deb-rpm
          path: |
            upstream/apps/desktop/release/*.AppImage
            upstream/apps/desktop/release/*.deb
            upstream/apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 3

      - name: Upload unpacked Electron app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-unpacked
          path: upstream/apps/desktop/release/linux-unpacked
          if-no-files-found: error
          retention-days: 1

  build-flatpak:
    name: Build Flatpak
    needs: [plan, build-packages]
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout upstream tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://github.com/NousResearch/hermes-agent.git upstream

      - name: Apply patches with git apply --3way
        run: |
          set -euo pipefail
          scripts/apply-packaging.sh upstream

      - name: Install Flatpak
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download unpacked Electron app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-unpacked
          path: upstream/apps/desktop/release/linux-unpacked

      - name: Place unpacked app where the manifest expects it
        run: |
          set -euo pipefail
          root=upstream/apps/desktop/release/linux-unpacked
          if [ ! -e "$root/Hermes" ] && [ -e "$root/linux-unpacked/Hermes" ]; then
            mv "$root/linux-unpacked" "${root}.next"
            rm -rf "$root"
            mv "${root}.next" "$root"
          fi
          test -e "$root/Hermes"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Stamp package metadata
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/release_metadata.py stamp --desktop upstream/apps/desktop --tag "$TAG" --date "$(date -u +%F)"

      - name: Stage and build the Flatpak bundle
        working-directory: upstream/apps/desktop
        env:
          HERMES_DESKTOP_UNPACKED_READY: "1"
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/stage-flatpak.mjs
          flatpak-builder --user --disable-rofiles-fuse --force-clean --install-deps-from=flathub \
            --repo=flatpak/repo flatpak/build-dir flatpak/com.nousresearch.Hermes.yml
          mkdir -p release
          flatpak build-bundle flatpak/repo "release/Hermes-${VERSION}-linux-x86_64.flatpak" com.nousresearch.Hermes
          test -s "release/Hermes-${VERSION}-linux-x86_64.flatpak"

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-flatpak
          path: upstream/apps/desktop/release/*.flatpak
          if-no-files-found: error
          retention-days: 3

  build-snap:
    name: Build Snap
    needs: [plan, build-packages]
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout upstream tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://github.com/NousResearch/hermes-agent.git upstream

      - name: Apply patches with git apply --3way
        run: |
          set -euo pipefail
          scripts/apply-packaging.sh upstream

      - name: Download unpacked Electron app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-unpacked
          path: upstream/apps/desktop/release/linux-unpacked

      - name: Place unpacked app where Snapcraft expects it
        run: |
          set -euo pipefail
          root=upstream/apps/desktop/release/linux-unpacked
          if [ ! -e "$root/Hermes" ] && [ -e "$root/linux-unpacked/Hermes" ]; then
            mv "$root/linux-unpacked" "${root}.next"
            rm -rf "$root"
            mv "${root}.next" "$root"
          fi
          test -e "$root/Hermes"

      - name: Stamp package metadata
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/release_metadata.py stamp --desktop upstream/apps/desktop --tag "$TAG" --date "$(date -u +%F)"

      - name: Install snapcraft
        run: |
          set -euo pipefail
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          sudo snap install snapcraft --classic

      - name: Build the snap
        working-directory: upstream/apps/desktop
        run: |
          set -euo pipefail
          sudo snapcraft --destructive-mode
          sudo chmod -R a+rX .

      - name: Upload Snap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-snap
          path: upstream/apps/desktop/*.snap
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [plan, build-packages, build-flatpak, build-snap]
    if: |
      always() &&
      needs.plan.outputs.action == 'publish' &&
      needs.build-packages.result == 'success' &&
      needs.build-flatpak.result == 'success' &&
      needs.build-snap.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false || inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-packages-*
          path: artifacts

      - name: Collect release assets
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
          PACKAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' -o -name '*.snap' \) -exec cp -t dist {} +
          ls -lh dist
          test -f "dist/Hermes-${VERSION}-linux-x86_64.AppImage"
          test -f "dist/Hermes-${VERSION}-linux-amd64.deb"
          test -f "dist/Hermes-${VERSION}-linux-x86_64.rpm"
          test -f "dist/Hermes-${VERSION}-linux-x86_64.flatpak"
          compgen -G 'dist/*.snap' >/dev/null
          chmod +x dist/*.AppImage
          python3 scripts/release_metadata.py notes \
            --tag "$TAG" \
            --upstream-sha "$UPSTREAM_SHA" \
            --packaging-sha "$PACKAGING_SHA" > notes.md

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Not uploading again."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hermes Desktop ${TAG}" \
            --notes-file notes.md \
            dist/*

  report-failure:
    name: Open or update failure issue
    needs: [plan, build-packages, build-flatpak, build-snap, release]
    if: |
      always() &&
      (needs.plan.result == 'failure' ||
       needs.build-packages.result == 'failure' ||
       needs.build-flatpak.result == 'failure' ||
       needs.build-snap.result == 'failure' ||
       needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout packaging
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLAN_REASON: ${{ needs.plan.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/failure
          {
            echo "Job results:"
            echo "- plan: ${{ needs.plan.result }}"
            echo "- build AppImage deb rpm: ${{ needs.build-packages.result }}"
            echo "- build Flatpak: ${{ needs.build-flatpak.result }}"
            echo "- build Snap: ${{ needs.build-snap.result }}"
            echo "- publish: ${{ needs.release.result }}"
            if [ -n "$PLAN_REASON" ]; then
              echo
              echo "Plan: $PLAN_REASON"
            fi
          } > /tmp/failure/reason.txt
          gh run view "$GITHUB_RUN_ID" --log-failed > /tmp/failure/log.txt 2>/dev/null || true
          if [ -s /tmp/failure/log.txt ]; then
            tail -c 20000 /tmp/failure/log.txt > /tmp/failure/log-excerpt.txt
          else
            : > /tmp/failure/log-excerpt.txt
          fi
          TAG="$TAG" \
            RUN_URL="$RUN_URL" \
            REASON="$(cat /tmp/failure/reason.txt)" \
            LOG_FILE=/tmp/failure/log-excerpt.txt \
            scripts/open-failure-issue.sh
